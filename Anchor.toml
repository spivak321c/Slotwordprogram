[toolchain]
anchor_version = "1.1.2"
[features]
seeds = false
skip-lint = false

[programs.localnet]
slotword = "S1otword11111111111111111111111111111111111"

[programs.devnet]
slotword = "S1otword11111111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# The anchor 1.x test runner spawns its own ephemeral validator; keep it off
# the 8899 port when a long-running solana-test-validator already owns it.
[surfpool]
rpc_port = 18899

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
unit = "cargo test --manifest-path programs/slotword/Cargo.toml"
